name: Bug
description: Something is broken in the app, pipeline or infrastructure
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, gameweek, environment (local / dev / prod), and relevant log lines. Never paste tokens or connection details.
    validations:
      required: true
