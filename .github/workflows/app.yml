name: app

# Runs on every PR (no path filter) because `build` is a required status check:
# a filtered-out run never reports, which would block merging docs-only PRs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/functions/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install function dependencies
        run: npm ci
        working-directory: app/functions

      - name: Lint function
        run: npm run lint
        working-directory: app/functions

      - name: Build function
        run: npm run build
        working-directory: app/functions
